<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c9a44e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ارسلان دوجو">
  <title>پنل شاگرد — باشگاه آنلاین ارسلان دوجو</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><circle cx='24' cy='24' r='20' fill='%23d9a441'/></svg>">
  <link rel="apple-touch-icon" href="/ui/icons/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="/ui/style.css">
  <link rel="stylesheet" href="/ui/shell.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="side-head">
        <div class="brand">
          <span class="mark sm">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <defs>
                <linearGradient id="ensoG" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#ff6b5e"></stop>
                  <stop offset="100%" stop-color="#d9a441"></stop>
                </linearGradient>
              </defs>
              <path d="M33.5 8.6A19 19 0 1 0 42.6 27.4" fill="none" stroke="url(#ensoG)" stroke-width="4.6" stroke-linecap="round"></path>
              <circle cx="24" cy="24" r="4.2" fill="url(#ensoG)"></circle>
            </svg>
          </span>
          <div>
            <div class="name">ارسلان دوجو</div>
            <div class="sub">پنل شاگرد</div>
          </div>
        </div>
      </div>

      <div class="side-label">پنل کاربری</div>
      <button class="nav-item active" data-view="home"><span class="ic">◈</span> خانه</button>
      <button class="nav-item" data-view="plans"><span class="ic">⚑</span> تمرینات من <span class="count hidden" id="cntPlans"></span></button>
      <button class="nav-item" data-view="progress"><span class="ic">▦</span> جدول پیشرفت</button>
      <button class="nav-item" data-view="news"><span class="ic">✦</span> اطلاعیه‌ها <span class="count hidden" id="cntNews"></span></button>
      <button class="nav-item" data-view="payment"><span class="ic">💳</span> پرداخت شهریه</button>
      <button class="nav-item" data-view="support"><span class="ic">📞</span> پشتیبانی</button>
      <button class="nav-item" data-view="profile"><span class="ic">☺</span> پروفایل من</button>

      <div class="side-foot">
        <a class="nav-item" id="coachLink" href="#" target="_blank" rel="noopener"><span class="ic">↗</span> پنل مربی</a>
        <button class="nav-item" id="logoutBtn"><span class="ic">⎋</span> خروج</button>
        <div class="tiny" style="padding:8px">سایت شماره ۲ از ۲</div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="row grow" style="gap:12px">
          <span id="meAvatar"></span>
          <div class="grow">
            <h1 id="viewTitle">خانه</h1>
            <div class="sub" id="todayLabel">—</div>
          </div>
        </div>
        <button class="btn icon bell" id="bellBtn" title="اعلان‌ها">🔔<span class="dot hidden" id="bellDot">0</span></button>
        <button class="btn" id="quickProgress">ثبت خودارزیابی</button>
      </div>

      <section class="section active" id="view-home"></section>

      <!-- CardSwap — decorative stack in home view -->
      <div id="cardSwapRoot" class="cardswap-wrap" style="display:none"></div>

      <!-- StackedBars — progress chart -->
      <div id="stackedBarsRoot" style="display:flex;justify-content:center;padding:20px 0"></div>
      <section class="section" id="view-plans"></section>
      <section class="section" id="view-progress"></section>
      <section class="section" id="view-news"></section>
      <section class="section" id="view-payment"></section>
      <section class="section" id="view-support"></section>
      <section class="section" id="view-profile"></section>
    </main>
  </div>

  <script src="/ui/jalali.browser.js"></script>
  <script src="/ui/ui.js"></script>
  <script src="/panel.js"></script>
  <script src="/CardSwap.js"></script>
  <script src="/StackedBars.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function(e) {});
    }
    /* CardSwap — show in home view after panel loads */
    (function() {
      function showCardSwap() {
        var root = document.getElementById('cardSwapRoot');
        if (root && window.CardSwap && window.CardSwap.mount) {
          root.style.display = 'flex';
          window.CardSwap.mount(root, { auto: true, every: 5 });
        }
      }
      var stackedBarsInstance = null;

      function makeBarsFromAPI(progress, mode) {
        var MONTHS_FA = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
        var MONTHS_SHORT = ['فرو','ارد','خرد','تیر','مرد','شهر','مهر','آبا','آذر','دی','بهم','اسف'];
        var out = [];

        if (mode === 'Month') {
          /* Monthly: one bar per month */
          for (var m = 1; m <= 12; m++) {
            var p = progress[m];
            if (!p) continue;
            var vals = [
              p.endurance || 0,
              p.strength || 0,
              p.technique || 0,
              p.flexibility || 0
            ];
            out.push({
              vals: vals,
              esc: p.sessions || 0,
              label: MONTHS_FA[m - 1],
              short: MONTHS_SHORT[m - 1]
            });
          }
        } else if (mode === 'Week') {
          /* Weekly: aggregate months into ~4 week blocks */
          var weeks = 8;
          for (var w = 0; w < weeks; w++) {
            var mIdx = Math.min(11, Math.floor(w * 12 / weeks));
            var p = progress[mIdx + 1];
            if (!p) { out.push({ vals: [0,0,0,0], esc: 0, label: 'هفته ' + (w+1), short: 'ه' + (w+1) }); continue; }
            var factor = 1 / (12 / weeks);
            var vals = [
              Math.round((p.endurance || 0) * factor),
              Math.round((p.strength || 0) * factor),
              Math.round((p.technique || 0) * factor),
              Math.round((p.flexibility || 0) * factor)
            ];
            out.push({
              vals: vals,
              esc: Math.round((p.sessions || 0) * factor),
              label: 'هفته ' + (w + 1),
              short: 'ه' + (w + 1)
            });
          }
        } else {
          /* Daily: spread months across ~20 days */
          var days = 14;
          for (var d = 0; d < days; d++) {
            var mIdx = Math.min(11, Math.floor(d * 12 / days));
            var p = progress[mIdx + 1];
            if (!p) { out.push({ vals: [0,0,0,0], esc: 0, label: 'روز ' + (d+1), short: (d+1).toString() }); continue; }
            var dayFactor = 1 / (12 / days * 30);
            var vals = [
              Math.round((p.endurance || 0) * dayFactor),
              Math.round((p.strength || 0) * dayFactor),
              Math.round((p.technique || 0) * dayFactor),
              Math.round((p.flexibility || 0) * dayFactor)
            ];
            out.push({
              vals: vals,
              esc: Math.max(0, Math.round((p.sessions || 0) * dayFactor)),
              label: 'روز ' + (d + 1),
              short: (d + 1).toString()
            });
          }
        }
        return out;
      }

      function loadStackedBarsData(instance, mode) {
        if (!instance || !UI) return;
        UI.api('/api/progress?year=1405').then(function(d) {
          if (d.ok && d.progress) {
            var bars = makeBarsFromAPI(d.progress, mode);
            instance.render(bars);
          }
        }).catch(function() {});
      }

      function showStackedBars() {
        var root = document.getElementById('stackedBarsRoot');
        if (root && window.StackedBars && window.StackedBars.mount) {
          stackedBarsInstance = window.StackedBars.mount(root, {
            colour: 'Colour',
            onModeChange: function(mode) {
              loadStackedBarsData(stackedBarsInstance, mode);
            }
          });
          loadStackedBarsData(stackedBarsInstance, 'Month');
        }
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
          setTimeout(showCardSwap, 800);
          setTimeout(showStackedBars, 600);
        });
      } else {
        setTimeout(showCardSwap, 800);
        setTimeout(showStackedBars, 600);
      }
    })();
  </script>
</body>
</html>

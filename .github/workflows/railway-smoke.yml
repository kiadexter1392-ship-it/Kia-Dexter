name: Verify live Railway deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check dedicated coach and student routes
        env:
          LIVE_URL: https://kia-dexter-production-cd4745b0.up.railway.app/member
          COACH_USERNAME: ${{ secrets.SMOKE_COACH_USERNAME }}
          COACH_PASSWORD: ${{ secrets.SMOKE_COACH_PASSWORD }}
          MEMBER_USERNAME: ${{ secrets.SMOKE_MEMBER_USERNAME }}
          MEMBER_PASSWORD: ${{ secrets.SMOKE_MEMBER_PASSWORD }}
          COACH_URL: https://kia-dexter-production-cd4745b0.up.railway.app
          MEMBER_URL: https://kia-dexter-production-cd4745b0.up.railway.app/member
        run: node tests/railway-roles.js
      - name: Install browser test tools (not production dependencies)
        run: npm install --no-save --package-lock=false playwright-core@1.65.1 @sparticuz/chromium@153.0.0
      - name: Verify magnifying dock mouse, touch and keyboard interactions
        run: node tests/magnifying-dock.browser.js
      - name: Verify default ports and both browser login flows on an isolated database
        env:
          BROWSER: '1'
          TEST_DEFAULT_PORTS: '1'
        run: node tests/port-routing.js
      - name: Verify registration and member details on an isolated database
        env:
          BROWSER: '1'
        run: node tests/member-details.js
      - name: Check actual Railway panels and dock in Chromium
        env:
          LIVE_URL: https://kia-dexter-production-cd4745b0.up.railway.app/member
          MEMBER_USERNAME: ${{ secrets.SMOKE_MEMBER_USERNAME }}
          MEMBER_PASSWORD: ${{ secrets.SMOKE_MEMBER_PASSWORD }}
          COACH_URL: https://kia-dexter-production-cd4745b0.up.railway.app
          COACH_USERNAME: ${{ secrets.SMOKE_COACH_USERNAME }}
          COACH_PASSWORD: ${{ secrets.SMOKE_COACH_PASSWORD }}
        run: node tests/stacked-bars.browser.js

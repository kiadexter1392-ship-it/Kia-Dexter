name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Init EAS Project
        working-directory: mobile
        run: eas init --account kia.dexter --non-interactive
        env:
          EXPO_TOKEN: 63-IGN-9xHj_SAivS21BueK3EWONXi6rOuuEJSD-

      - name: Build with EAS
        working-directory: mobile
        run: eas build --platform android --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: 63-IGN-9xHj_SAivS21BueK3EWONXi6rOuuEJSD-

      - name: Build Info
        run: |
          echo "Build submitted!"
          echo "Check status: https://expo.dev/accounts/kia.dexter/projects/arslan-dojo/builds"

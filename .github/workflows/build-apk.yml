name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set ANDROID_HOME
        run: echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: List build outputs
        working-directory: mobile/android
        run: |
          echo "=== build/outputs ==="
          find app/build/outputs -type f 2>/dev/null || echo "not found"
          echo "=== app/build ==="
          find app/build -name "*.apk" -o -name "*.aab" 2>/dev/null || echo "none"

      - name: Build Debug APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --info 2>&1 | tail -100

      - name: Find APK or AAB
        id: find-artifact
        working-directory: mobile/android
        run: |
          APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          AAB=$(find . -name "*.aab" -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "artifact_path=$APK" >> $GITHUB_OUTPUT
            echo "type=apk" >> $GITHUB_OUTPUT
            echo "Found APK: $APK"
          elif [ -n "$AAB" ]; then
            echo "artifact_path=$AAB" >> $GITHUB_OUTPUT
            echo "type=aab" >> $GITHUB_OUTPUT
            echo "Found AAB: $AAB"
          else
            echo "No artifact found!"
            find . -type f -name "*.apk" -o -name "*.aab" 2>/dev/null
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArslanDojo-${{ steps.find-artifact.outputs.type }}
          path: ${{ steps.find-artifact.outputs.artifact_path }}

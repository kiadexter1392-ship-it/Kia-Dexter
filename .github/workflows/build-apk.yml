name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set ANDROID_HOME
        run: echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Fix Kotlin version
        working-directory: mobile/android
        run: echo "android.kotlinVersion=1.9.24" >> gradle.properties

      - name: Create app icon
        working-directory: mobile/android
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$d
          done
          node -e "const fs=require('fs');const s=192;let p='';for(let y=0;y<s;y++){p+='\x00';for(let x=0;x<s;x++){const cx=s/2,cy=s/2,r=s/2-4,d=Math.hypot(x-cx,y-cy);if(d<=r)p+='\xd4\xa8\x53\xff';else p+='\x00\x00\x00\x00';}};const zlib=require('zlib');const crc=require('zlib').crc32||((b)=>{let c=0;for(let i=0;i<b.length;i++)c=(c*31+b[i])&0xffffffff;return c;});function chunk(t,d){const cd=Buffer.concat([Buffer.from(t),Buffer.from(d)]);return Buffer.concat([Buffer.alloc(4).writeUInt32BE(d.length,0),cd,Buffer.alloc(4).writeUInt32BE(crc(cd.toString('binary'))&0xffffffff,0)]);};const raw=Buffer.from(p,'binary');const png=Buffer.concat([Buffer.from('\x89PNG\r\n\x1a\n','binary'),chunk('IHDR',Buffer.concat([Buffer.alloc(4).writeUInt32BE(s,0),Buffer.alloc(4).writeUInt32BE(s,0),Buffer.from([8,6,0,0,0])])),chunk('IDAT',zlib.deflateSync(raw)),chunk('IEND',Buffer.alloc(0))]);for(const d of['mdpi','hdpi','xhdpi','xxhdpi','xxxhdpi']){fs.writeFileSync('app/src/main/res/mipmap-'+d+'/ic_launcher.png',png);fs.writeFileSync('app/src/main/res/mipmap-'+d+'/ic_launcher_round.png',png);};console.log('Icons created');"

      - name: Bundle JS for release
        working-directory: mobile
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file App.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/

      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}

      - name: Find APK
        id: apk
        run: |
          APK=$(find mobile/android -name "*.apk" -type f 2>/dev/null | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found: $APK"

      - name: Upload APK
        if: steps.apk.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ArslanDojo-debug.apk
          path: ${{ steps.apk.outputs.path }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log.txt
          path: /tmp/build.log

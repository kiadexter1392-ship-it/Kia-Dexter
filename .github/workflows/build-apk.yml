name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set ANDROID_HOME
        run: echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Set Gradle JVM args
        working-directory: mobile/android
        run: echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> gradle.properties

      - name: Build Debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --max-workers=1 --stacktrace

      - name: Find and upload APK
        run: |
          APK=$(find mobile/android -name "*.apk" -type f | head -1)
          echo "APK found: $APK"
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found!"
            find mobile/android -type f -name "*.apk" 2>/dev/null
            find mobile/android/app/build -type f 2>/dev/null | head -20
            exit 1
          fi
          cp "$APK" ArslanDojo-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArslanDojo-debug.apk
          path: ArslanDojo-debug.apk

name: Build Play Store AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-play-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean stale local Gradle caches
        run: rm -rf .gradle .kotlin build app/build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses and install SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager "$SDK_ROOT"/tools/bin/sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          (set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true)
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "ERROR: Missing GitHub Actions secret GOOGLE_SERVICES_JSON."
            exit 1
          fi

      - name: Validate and decode Play upload keystore
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          if [ -z "$PLAY_KEYSTORE_BASE64" ] || [ -z "$PLAY_KEYSTORE_PASSWORD" ] || [ -z "$PLAY_KEY_ALIAS" ] || [ -z "$PLAY_KEY_PASSWORD" ]; then
            echo "ERROR: One or more Play signing secrets are missing:"
            echo "Required secrets: PLAY_KEYSTORE_BASE64, PLAY_KEYSTORE_PASSWORD, PLAY_KEY_ALIAS, PLAY_KEY_PASSWORD"
            exit 1
          fi
          printf '%s' "$PLAY_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > release-upload.keystore

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests and build release-signed AAB
        env:
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          gradle :app:testDebugUnitTest :app:bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release-upload.keystore" \
            -Pandroid.injected.signing.store.password="$PLAY_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$PLAY_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$PLAY_KEY_PASSWORD"

      - name: Verify AAB release signature
        run: |
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "ERROR: AAB not found at $AAB_PATH"
            exit 1
          fi
          CERT_INFO="$(keytool -printcert -jarfile "$AAB_PATH")"
          echo "$CERT_INFO"
          if echo "$CERT_INFO" | grep -q "CN=Android Debug"; then
            echo "ERROR: Bundle is still signed with Android Debug key, which Google Play rejects."
            exit 1
          fi

      - name: Clean up sensitive signing files
        if: always()
        run: rm -f release-upload.keystore app/google-services.json

      - name: Upload Play Store AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: arsalan-dojo-play-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

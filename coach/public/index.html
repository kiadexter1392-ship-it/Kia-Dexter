<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ارسلان دوجو — پنل مربی</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><circle cx='24' cy='24' r='20' fill='%23e2483d'/></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="/ui/style.css">
  <link rel="stylesheet" href="/ui/shell.css">
  <link rel="stylesheet" href="/ui/dojo-3d.css">
</head>
<body class="dojo-landing">

  <header class="dojo-nav" id="dojoNav">
    <div class="dojo-brand">
      <span class="dojo-logo">
        <svg viewBox="0 0 48 48"><defs><linearGradient id="gL" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff6b5e"/><stop offset="100%" stop-color="#d9a441"/></linearGradient></defs><path d="M33.5 8.6A19 19 0 1 0 42.6 27.4" fill="none" stroke="url(#gL)" stroke-width="4.6" stroke-linecap="round"/><circle cx="24" cy="24" r="4.2" fill="url(#gL)"/></svg>
      </span>
      <div><div class="dojo-brand-name">ارسلان دوجو</div><div class="dojo-brand-sub">COACH PANEL</div></div>
    </div>
    <nav class="dojo-links" id="dojoLinks">
      <a href="#" id="membersLinkNav">سایت شاگردان</a>
    </nav>
    <div class="dojo-nav-actions">
      <button class="dojo-menu-btn" id="menuBtn">☰</button>
    </div>
  </header>

  <section class="dojo-hero" id="hero">
    <div class="dojo-hero-bg">
      <div class="dojo-scene">
        <div class="dojo-cube" id="heroCube">
          <div class="dojo-cube-face dojo-cube-front">👨‍🏫</div>
          <div class="dojo-cube-face dojo-cube-back">📊</div>
          <div class="dojo-cube-face dojo-cube-right">⚑</div>
          <div class="dojo-cube-face dojo-cube-left">📢</div>
          <div class="dojo-cube-face dojo-cube-top"></div>
          <div class="dojo-cube-face dojo-cube-bottom"></div>
        </div>
      </div>
      <div class="dojo-depth-layer dojo-depth-1"></div>
      <div class="dojo-depth-layer dojo-depth-2"></div>
    </div>
    <div class="dojo-hero-content">
      <h1 class="dojo-title">پنل مربی</h1>
      <p class="dojo-subtitle">
        ارسال تمرین، ثبت پیشرفت ماهانه شاگردان، اطلاع‌رسانی و دسترسی مستقیم به پنل هر شاگرد.
      </p>
      <div class="dojo-cta">
        <a href="#auth" class="dojo-btn dojo-btn-primary">ورود</a>
        <a href="#" id="goMembersBtn" class="dojo-btn dojo-btn-outline">سایت شاگردان ←</a>
      </div>
    </div>
    <div class="dojo-hero-visual">
      <div class="dojo-3d-scene">
        <div class="dojo-3d-panel dojo-3d-p1">
          <div class="dojo-3d-panel-inner">
            <div class="dojo-3d-panel-label">امکانات</div>
            <div class="dojo-3d-panel-list">
              <span>ارسال تمرین</span><span>جدول پیشرفت</span><span>اطلاعیه</span><span>بازخورد</span>
            </div>
          </div>
        </div>
        <div class="dojo-3d-panel dojo-3d-p2">
          <div class="dojo-3d-panel-inner">
            <div class="dojo-3d-panel-label">دسترسی</div>
            <div class="dojo-3d-panel-list">
              <span>ورود به پنل شاگرد</span><span>خروجی اکسل</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="dojo-auth-section" id="auth">
    <div class="dojo-auth-card">
      <div style="text-align:center;margin-bottom:18px">
        <h3 style="margin:0;font-size:17px">ورود مربی</h3>
      </div>
      <div class="dojo-error hidden" id="errorMsg"></div>
      <form id="loginForm" class="dojo-form" method="POST" action="/login">
        <div class="dojo-field">
          <label>نام کاربری</label>
          <input name="username" type="text" class="en" autocomplete="username" required>
        </div>
        <div class="dojo-field">
          <label>رمز عبور</label>
          <input name="password" type="password" class="en" autocomplete="current-password" required>
        </div>
        <button class="dojo-btn dojo-btn-primary dojo-btn-full" type="submit">ورود</button>
        <a href="#" id="goMembers" class="dojo-btn dojo-btn-outline dojo-btn-full" style="margin-top:6px">سایت شاگردان ←</a>
      </form>
    </div>
  </section>

  <footer class="dojo-footer">
    <div class="dojo-footer-inner">
      <div class="dojo-footer-brand"><strong>ارسلان دوجو — پنل مربی</strong></div>
    </div>
  </footer>

  <script src="/ui/jalali.browser.js"></script>
  <script src="/ui/ui.js"></script>
  <script src="/ui/dojo-3d.js"></script>
  <script>
    (function () {
      var errorMsg = document.getElementById('errorMsg');

      document.getElementById('menuBtn').addEventListener('click', function () {
        document.getElementById('dojoLinks').classList.toggle('open');
      });

      // نمایش خطا از URL
      var params = new URLSearchParams(location.search);
      var err = params.get('error');
      if (err) {
        errorMsg.textContent = err;
        errorMsg.classList.remove('hidden');
      }

      UI.loadConfig().then(function (cfg) {
        var members = UI.peerUrl(cfg.memberPort);
        document.getElementById('membersLinkNav').href = members;
        document.getElementById('goMembers').href = members;
        document.getElementById('goMembersBtn').href = members;
      }).catch(function () { });

      Dojo3D.init();
    }());
  </script>
</body>
</html>
